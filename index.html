<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamer Highlights</title>
<style>
  :root { --bg: #14082a; --card: #1f0f3d; --text: #f3eefc; --muted: #b9a8d9; --accent: #ff3cc8; --accent2: #00dcff; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  p { color: var(--muted); margin: 0 0 28px; }
  .links { display: grid; gap: 12px; }
  a.card { display: block; background: var(--card); color: var(--text); text-decoration: none; padding: 16px 20px;
           border-radius: 12px; border: 1px solid #3a2466; }
  a.card:hover { border-color: var(--accent2); }
  footer { margin-top: 40px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Streamer <span>Highlights</span></h1>
  <p>Daily highlight clips from the biggest streamers on Twitch, Kick and YouTube.</p>
  <div class="links">
    <a class="card" href="https://www.youtube.com/@streamer.highlightshq">▶ YouTube channel</a>
    <a class="card" href="https://www.instagram.com/streamer.highlights_/">📸 Instagram</a>
    <a class="card" href="https://www.tiktok.com/@streamer.highlights_">🎵 TikTok</a>
    <a class="card" href="privacy.html">Privacy Policy</a>
    <a class="card" href="terms.html">Terms of Service</a>
  </div>
  <footer>Clip Watcher is the private tool behind these accounts.</footer>
</main>
</body>
</html>
